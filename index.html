<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grok Imagine Studio</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f0f10;
    color: #e8e8ea;
    margin: 0;
    padding: 24px;
    min-height: 100vh;
  }
  .container { max-width: 920px; margin: 0 auto; }
  h1 { font-weight: 600; letter-spacing: -0.02em; margin: 0 0 8px; }
  .subtitle { color: #8a8a92; margin-bottom: 24px; font-size: 14px; }
  .card {
    background: #18181b;
    border: 1px solid #2a2a2f;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  label {
    display: block;
    font-size: 13px;
    color: #b4b4ba;
    margin-bottom: 8px;
    font-weight: 500;
  }
  textarea, input[type="text"], input[type="password"], select {
    width: 100%;
    background: #0f0f10;
    border: 1px solid #2a2a2f;
    border-radius: 8px;
    padding: 10px 12px;
    color: #e8e8ea;
    font-family: inherit;
    font-size: 14px;
    resize: vertical;
  }
  textarea { min-height: 80px; }
  textarea:focus, input:focus, select:focus { outline: none; border-color: #4a4a55; }

  /* Mode tabs */
  .tabs {
    display: flex;
    gap: 4px;
    background: #18181b;
    border: 1px solid #2a2a2f;
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 16px;
  }
  .tab {
    flex: 1;
    background: transparent;
    color: #8a8a92;
    border: none;
    padding: 10px 16px;
    border-radius: 7px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }
  .tab.active { background: #2a2a2f; color: #e8e8ea; }
  .tab:hover:not(.active) { color: #c0c0c6; }

  .key-row { display: flex; gap: 8px; align-items: center; }
  .key-row input { flex: 1; }
  .toggle-btn {
    background: transparent;
    color: #b4b4ba;
    border: 1px solid #2a2a2f;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .toggle-btn:hover { background: #1a1a1e; color: #e8e8ea; }
  .key-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
    font-size: 12px;
    color: #6a6a72;
  }
  .key-meta a { color: #8a8a92; cursor: pointer; text-decoration: underline; }

  .file-zone {
    border: 2px dashed #2a2a2f;
    border-radius: 8px;
    padding: 24px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .file-zone:hover, .file-zone.drag { border-color: #4a4a55; background: #1a1a1e; }
  .file-zone input { display: none; }
  .file-zone p { margin: 0; color: #8a8a92; font-size: 14px; }
  .preview {
    max-width: 100%;
    max-height: 280px;
    border-radius: 8px;
    margin-top: 12px;
    display: block;
  }

  button.primary {
    background: #e8e8ea;
    color: #0f0f10;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button.primary:hover:not(:disabled) { opacity: 0.85; }
  button.primary:disabled { opacity: 0.4; cursor: not-allowed; }

  .error { color: #ff6b6b; font-size: 13px; margin-top: 8px; word-break: break-word; }
  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid #0f0f10;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    vertical-align: -2px;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* History list */
  .history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 32px 0 12px;
  }
  .history-header h2 {
    font-size: 16px;
    font-weight: 600;
    margin: 0;
    color: #e8e8ea;
  }
  .clear-history {
    background: transparent;
    color: #8a8a92;
    border: 1px solid #2a2a2f;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
  }
  .clear-history:hover { background: #1a1a1e; color: #ff6b6b; }
  .history-empty {
    text-align: center;
    color: #6a6a72;
    font-size: 13px;
    padding: 24px;
  }
  .history-item {
    background: #18181b;
    border: 1px solid #2a2a2f;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .history-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-size: 12px;
    color: #8a8a92;
  }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .badge.image { background: #1e3a5f; color: #93c5fd; }
  .badge.video { background: #3a1e5f; color: #c5a3fd; }
  .history-prompt {
    color: #c0c0c6;
    font-size: 13px;
    margin-bottom: 10px;
    font-style: italic;
  }
  .history-media {
    max-width: 100%;
    border-radius: 8px;
    display: block;
    margin-bottom: 10px;
  }
  .history-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .history-actions a, .history-actions button {
    background: transparent;
    color: #e8e8ea;
    border: 1px solid #2a2a2f;
    padding: 6px 12px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 12px;
    cursor: pointer;
  }
  .history-actions a:hover, .history-actions button:hover { background: #1a1a1e; }
  .delete-btn { color: #ff6b6b !important; }
</style>
</head>
<body>
<div class="container">
  <h1>Grok Imagine Studio</h1>
  <p class="subtitle">สร้างภาพและวิดีโอด้วย xAI Grok Imagine</p>

  <!-- API Key -->
  <div class="card">
    <label for="apiKey">xAI API Key</label>
    <div class="key-row">
      <input type="password" id="apiKey" placeholder="xai-...">
      <button class="toggle-btn" id="toggleKey" type="button">แสดง</button>
    </div>
    <div class="key-meta">
      <span>เก็บไว้ใน browser ของคุณ (localStorage) เท่านั้น</span>
      <a id="clearKey">ล้าง key</a>
    </div>
  </div>

  <!-- Mode tabs -->
  <div class="tabs">
    <button class="tab active" data-mode="image">🎨 Image Edit</button>
    <button class="tab" data-mode="video">🎬 Image to Video</button>
  </div>

  <!-- Prompt -->
  <div class="card">
    <label for="prompt">Prompt</label>
    <textarea id="prompt" placeholder="คำอธิบายผลลัพธ์ที่ต้องการ">Render this as a pencil sketch with detailed shading</textarea>
  </div>

  <!-- Video options (เฉพาะโหมด video) -->
  <div class="card" id="videoOptions" style="display:none;">
    <label for="duration">ความยาววิดีโอ (วินาที)</label>
    <select id="duration">
      <option value="6">6 วินาที</option>
      <option value="12" selected>12 วินาที</option>
      <option value="15">15 วินาที</option>
    </select>
  </div>

  <!-- Image upload -->
  <div class="card">
    <label id="imageLabel">รูปต้นฉบับ</label>
    <label class="file-zone" id="dropZone">
      <input type="file" id="fileInput" accept="image/*">
      <p id="fileLabel">คลิกเพื่อเลือกไฟล์ หรือลากมาวางที่นี่</p>
    </label>
    <img id="preview" class="preview" style="display:none">
  </div>

  <!-- Generate -->
  <div class="card" style="text-align:center;">
    <button class="primary" id="generateBtn">สร้างผลลัพธ์</button>
    <div id="error" class="error"></div>
  </div>

  <!-- History -->
  <div class="history-header">
    <h2>ผลลัพธ์ทั้งหมด</h2>
    <button class="clear-history" id="clearHistory">ล้างทั้งหมด</button>
  </div>
  <div id="historyList">
    <div class="history-empty">ยังไม่มีผลลัพธ์ — สร้างอันแรกได้เลย</div>
  </div>
</div>

<script>
  const IMAGE_MODEL = "grok-imagine-image-quality";
  const VIDEO_MODEL = "grok-imagine-video";
  const STORAGE_KEY = "xai_api_key";
  const HISTORY_KEY = "grok_imagine_history";
  const MAX_HISTORY = 30;

  // --- elements ---
  const apiKeyEl = document.getElementById("apiKey");
  const toggleKeyBtn = document.getElementById("toggleKey");
  const clearKeyBtn = document.getElementById("clearKey");
  const tabs = document.querySelectorAll(".tab");
  const videoOptions = document.getElementById("videoOptions");
  const durationEl = document.getElementById("duration");
  const promptEl = document.getElementById("prompt");
  const fileInput = document.getElementById("fileInput");
  const fileLabel = document.getElementById("fileLabel");
  const dropZone = document.getElementById("dropZone");
  const preview = document.getElementById("preview");
  const generateBtn = document.getElementById("generateBtn");
  const errorEl = document.getElementById("error");
  const historyList = document.getElementById("historyList");
  const clearHistoryBtn = document.getElementById("clearHistory");

  let selectedFile = null;
  let currentMode = "image";

  // --- API key persistence ---
  const savedKey = localStorage.getItem(STORAGE_KEY);
  if (savedKey) apiKeyEl.value = savedKey;
  apiKeyEl.addEventListener("input", () => {
    const v = apiKeyEl.value.trim();
    if (v) localStorage.setItem(STORAGE_KEY, v);
    else localStorage.removeItem(STORAGE_KEY);
  });
  toggleKeyBtn.addEventListener("click", () => {
    if (apiKeyEl.type === "password") {
      apiKeyEl.type = "text";
      toggleKeyBtn.textContent = "ซ่อน";
    } else {
      apiKeyEl.type = "password";
      toggleKeyBtn.textContent = "แสดง";
    }
  });
  clearKeyBtn.addEventListener("click", () => {
    apiKeyEl.value = "";
    localStorage.removeItem(STORAGE_KEY);
  });

  // --- Mode tab switching ---
  tabs.forEach(tab => {
    tab.addEventListener("click", () => {
      tabs.forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      currentMode = tab.dataset.mode;
      if (currentMode === "video") {
        videoOptions.style.display = "block";
        promptEl.placeholder = "เช่น: Generate a slow and serene time-lapse";
      } else {
        videoOptions.style.display = "none";
        promptEl.placeholder = "เช่น: Render this as a pencil sketch with detailed shading";
      }
    });
  });

  // --- File handling ---
  function handleFile(file) {
    if (!file || !file.type.startsWith("image/")) {
      errorEl.textContent = "กรุณาเลือกไฟล์รูปภาพ";
      return;
    }
    selectedFile = file;
    fileLabel.textContent = file.name;
    const reader = new FileReader();
    reader.onload = e => {
      preview.src = e.target.result;
      preview.style.display = "block";
    };
    reader.readAsDataURL(file);
    errorEl.textContent = "";
  }
  fileInput.addEventListener("change", e => handleFile(e.target.files[0]));
  ["dragenter", "dragover"].forEach(ev =>
    dropZone.addEventListener(ev, e => {
      e.preventDefault(); e.stopPropagation();
      dropZone.classList.add("drag");
    })
  );
  ["dragleave", "drop"].forEach(ev =>
    dropZone.addEventListener(ev, e => {
      e.preventDefault(); e.stopPropagation();
      dropZone.classList.remove("drag");
    })
  );
  dropZone.addEventListener("drop", e => {
    const file = e.dataTransfer.files[0];
    if (file) handleFile(file);
  });

  function fileToDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve({ dataUrl: reader.result, mime: file.type });
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // --- History (localStorage) ---
  function loadHistory() {
    try {
      const raw = localStorage.getItem(HISTORY_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch { return []; }
  }
  function saveHistory(items) {
    try {
      localStorage.setItem(HISTORY_KEY, JSON.stringify(items.slice(0, MAX_HISTORY)));
    } catch (e) {
      // localStorage อาจเต็มถ้ารูป/วิดีโอเยอะ
      console.warn("History save failed:", e);
    }
  }
  function addHistoryItem(item) {
    const items = loadHistory();
    items.unshift(item);
    saveHistory(items);
    renderHistory();
  }
  function deleteHistoryItem(id) {
    const items = loadHistory().filter(x => x.id !== id);
    saveHistory(items);
    renderHistory();
  }
  function renderHistory() {
    const items = loadHistory();
    if (items.length === 0) {
      historyList.innerHTML = '<div class="history-empty">ยังไม่มีผลลัพธ์ — สร้างอันแรกได้เลย</div>';
      return;
    }
    historyList.innerHTML = items.map(it => {
      const date = new Date(it.timestamp).toLocaleString("th-TH");
      const badge = it.type === "video"
        ? '<span class="badge video">Video</span>'
        : '<span class="badge image">Image</span>';
      let mediaHtml = "";
      let downloadName = "";
      if (it.type === "video") {
        mediaHtml = `<video class="history-media" controls src="${it.url}"></video>`;
        downloadName = `grok-video-${it.id}.mp4`;
      } else {
        mediaHtml = `<img class="history-media" src="${it.url}" alt="">`;
        downloadName = `grok-image-${it.id}.png`;
      }
      return `
        <div class="history-item">
          <div class="history-meta">
            <span>${badge} <span style="margin-left:6px;">${date}</span></span>
          </div>
          <div class="history-prompt">"${escapeHtml(it.prompt)}"</div>
          ${mediaHtml}
          <div class="history-actions">
            <a href="${it.url}" download="${downloadName}" target="_blank">ดาวน์โหลด</a>
            <a href="${it.url}" target="_blank">เปิดในแท็บใหม่</a>
            <button class="delete-btn" data-id="${it.id}">ลบ</button>
          </div>
        </div>
      `;
    }).join("");

    // bind delete buttons
    historyList.querySelectorAll(".delete-btn").forEach(btn => {
      btn.addEventListener("click", () => deleteHistoryItem(btn.dataset.id));
    });
  }
  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
    }[c]));
  }
  clearHistoryBtn.addEventListener("click", () => {
    if (confirm("ล้างผลลัพธ์ทั้งหมด?")) {
      localStorage.removeItem(HISTORY_KEY);
      renderHistory();
    }
  });

  // --- Generate ---
  generateBtn.addEventListener("click", async () => {
    errorEl.textContent = "";
    const apiKey = apiKeyEl.value.trim();
    const promptText = promptEl.value.trim();

    if (!apiKey) { errorEl.textContent = "กรุณาใส่ xAI API Key"; return; }
    if (!promptText) { errorEl.textContent = "กรุณากรอก prompt"; return; }
    if (!selectedFile) { errorEl.textContent = "กรุณาเลือกรูปภาพ"; return; }

    generateBtn.disabled = true;
    generateBtn.innerHTML = '<span class="spinner"></span>กำลังสร้าง...';

    try {
      const { dataUrl, mime } = await fileToDataUrl(selectedFile);

      if (currentMode === "image") {
        await generateImage(apiKey, promptText, dataUrl, mime);
      } else {
        await generateVideo(apiKey, promptText, dataUrl, parseInt(durationEl.value, 10));
      }
    } catch (err) {
      errorEl.textContent = "เกิดข้อผิดพลาด: " + err.message;
      console.error(err);
    } finally {
      generateBtn.disabled = false;
      generateBtn.textContent = "สร้างผลลัพธ์";
    }
  });

  async function generateImage(apiKey, promptText, dataUrl, mime) {
    const base64 = dataUrl.split(",")[1];
    const res = await fetch("https://api.x.ai/v1/images/generations", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${apiKey}`
      },
      body: JSON.stringify({
        model: IMAGE_MODEL,
        prompt: promptText,
        image: `data:${mime};base64,${base64}`,
        response_format: "b64_json",
        n: 1
      })
    });
    if (!res.ok) {
      const text = await res.text();
      throw new Error(`HTTP ${res.status}: ${text}`);
    }
    const data = await res.json();
    const b64 = data?.data?.[0]?.b64_json;
    const url = data?.data?.[0]?.url;
    const imgSrc = b64 ? `data:image/png;base64,${b64}` : url;
    if (!imgSrc) throw new Error("ไม่พบภาพในผลลัพธ์");

    addHistoryItem({
      id: Date.now().toString(),
      type: "image",
      prompt: promptText,
      url: imgSrc,
      timestamp: Date.now()
    });
  }

  async function generateVideo(apiKey, promptText, dataUrl, duration) {
    const res = await fetch("https://api.x.ai/v1/videos/generations", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${apiKey}`
      },
      body: JSON.stringify({
        model: VIDEO_MODEL,
        prompt: promptText,
        image: dataUrl,
        duration: duration
      })
    });
    if (!res.ok) {
      const text = await res.text();
      throw new Error(`HTTP ${res.status}: ${text}`);
    }
    const data = await res.json();
    // xAI อาจคืน videoUrl ใน providerMetadata หรือ field อื่น
    const videoUrl =
      data?.video_url ||
      data?.providerMetadata?.xai?.videoUrl ||
      data?.data?.[0]?.url;
    if (!videoUrl) throw new Error("ไม่พบ video URL: " + JSON.stringify(data));

    addHistoryItem({
      id: Date.now().toString(),
      type: "video",
      prompt: promptText,
      url: videoUrl,
      timestamp: Date.now()
    });
  }

  // initial render
  renderHistory();
</script>
</body>
</html>
